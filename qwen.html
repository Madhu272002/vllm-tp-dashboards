<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root { --tp2:#1e3a8a; --tp4:#f97316; --bg:#f8fafc; --card:#fff; --text:#1e293b; --muted:#64748b; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding:28px; }
    .header { text-align:center; margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid #e2e8f0; }
    .header h1 { font-size:1.7rem; font-weight:700; }
    .header p { color:var(--muted); font-size:.9rem; margin-top:6px; }
    .executive-summary { max-width:1500px; margin:0 auto 26px; background:#f1f5f9; border-left:4px solid #3b82f6; border-radius:8px; padding:24px; }
    .executive-summary h2 { font-size:18px; font-weight:600; margin-bottom:16px; color:#1e293b; }
    .exec-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .exec-item { color:#475569; font-size:14px; line-height:1.6; }
    .exec-item strong { color:#1e293b; font-weight:600; }
    .color-legend { max-width:1500px; margin:0 auto 18px; display:flex; justify-content:center; gap:20px; font-size:.85rem; color:var(--text); }
    .color-legend > span { display:inline-flex; align-items:center; gap:6px; }
    .color-legend .swatch { width:14px; height:14px; border-radius:3px; }
    .grid { max-width:1500px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
    .chart-container { background:var(--card); border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); height:250px; }
    canvas { width:100% !important; height:100% !important; }
    table { max-width:1500px; margin:30px auto 0; width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); font-size:.8rem; }
    th, td { padding:9px 10px; text-align:right; border-bottom:1px solid #e2e8f0; font-variant-numeric:tabular-nums; transition:background .12s; }
    th:first-child, td:first-child { text-align:left; }
    thead th { background:#f1f5f9; font-weight:600; }
    tbody tr:nth-child(even) { background:#f8fafc; }
    tbody tr:hover { background:#eef2ff; }
    @media (max-width:1300px) { .grid { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
    .footer { max-width:1500px; margin:24px auto 0; text-align:center; font-size:.75rem; color:var(--muted); padding:12px; border-top:1px solid #e2e8f0; }
</style>
</head>
<body>

<script>
const D = {"tp2":{"lat_avg":[9475.8,9932.24,10400.06,13220.42,15395.88,19430.96,28692.33,47642.19,86917.54],"tput_per_gpu":[53.31,102.22,195.63,307.82,526.28,833.52,1131.07,1361.88,1494.79],"out_tput_user":[108.5,104.24,100.87,80.7,69.74,56.2,38.19,22.35,12.04],"gpu_util":[97.99,98.29,98.16,98.1,98.53,98.92,99.56,99.66,99.72],"e2e_tput_user":[106.92,102.45,98.03,77.12,65.99,52.29,35.45,21.33,11.71],"osl_min":[569,670,612,619,410,498,238,273,200],"osl_max":[1024,1026,1024,1028,1032,1030,1031,1031,1055],"prefill_tput_user":[738.45,589.28,383.67,209.27,168.78,107.43,69.96,56.3,50.85],"total_tput":[117.14840375748145,224.52412510511041,429.62943341076749,676.03136975035693,1156.1615594135933,1831.113570727751,2484.6233403640604,2991.9820230012697,3283.7501725685988],"active_gpus":[2,2,2,2,2,2,2,2,2],"image_tput":[0.11,0.1,0.1,0.08,0.06,0.05,0.03,0.02,0.01],"itl_avg":[9.28,9.62,9.94,12.42,14.44,17.89,26.4,45.13,83.66],"ttft_avg":[151.65,180.45,301.59,596.22,835.97,1350.27,2064.55,2230.57,2518.15],"itl_p99":[14.05,12.65,10.14,14.77,21.62,25.67,37.36,66.72,121.25],"out_tput":[106.61962977127901,204.43284037596817,391.25355840868917,615.64413045131153,1052.566624469931,1667.0394287138345,2262.1477227470118,2723.760663589967,2989.5844975139576],"duration":[949.778199542,497.728250573,260.580377632,264.95663961,308.895410933,390.067558571,575.34394722,954.435547422,1740.5157821520002],"gpu_mem_gb":[28.73,28.83,28.9,28.92,28.95,29.12,29.39,30.18,35.84],"sm_util":[null,null,null,null,null,null,null,null,null],"osl_avg":[1012.65,1017.52,1019.53,1019.49,1016.04,1016.03,1016.81,1015.49,1016.29],"lat_p99":[9499.66,10004.42,10442.57,13453.82,15569.07,19831.36,30150.86,52192.27,100312.48],"gpu_power_active":[438.07,415.48,416.44,370.7,365.8,357.91,330.86,332.75,325.67],"gpu_temp":[65.83,67.04,66.6,65.55,66.51,66.36,64.88,65.33,64.61],"req_tput":[0.1052877398620244,0.20091284729142245,0.38375875002078325,0.60387239299045392,1.0359493494366241,1.6407414201391664,2.2247561761704842,2.68 per_joule":[0.2111,0.3934,0.7418,1.328,2.0922,3.2291,4.3797,5.0039,5.3123]},"concurrency":[1,2,4,8,16,32,64,128,256]};
const C = { tp2:'#1e3a8a', tp4:'#f97316' };

function chart(id, title, yLabel, key) {
    new Chart(document.getElementById(id), {
        type: 'line',
        data: {
            labels: D.concurrency,
            datasets: [
                { label:'TP2', data:D.tp2[key], borderColor:C.tp2, backgroundColor:C.tp2, fill:false, tension:.3, borderWidth:2, pointRadius:3 },
                { label:'TP4', data:D.tp4[key], borderColor:C.tp4, backgroundColor:C.tp4, fill:false, tension:.3, borderWidth:2, pointRadius:3 }
            ]
        },
        options: {
            responsive:true, maintainAspectRatio:false,
            interaction:{ mode:'index', intersect:false },
            plugins:{
                title:{ display:true, text:title, font:{ size:13, weight:'600' } },
                legend:{ display:true, labels:{ boxWidth:12, font:{ size:11 } } }
            },
            scales:{
                y:{ title:{ display:true, text:yLabel } },
                x:{ title:{ display:true, text:'Concurrency' } }
            }
        }
    });
}

chart('c_out_tput', 'Output Token Throughput', 'tokens/sec', 'out_tput');
chart('c_total_tput', 'Total Token Throughput', 'tokens/sec', 'total_tput');
chart('c_tput_per_gpu', 'Output Throughput per GPU', 'tokens/sec/GPU', 'tput_per_gpu');
chart('c_out_tput_user', 'Output Throughput Per User', 'tokens/sec/user', 'out_tput_user');
chart('c_e2e_tput_user', 'E2E Output Throughput Per User', 'tokens/sec/user', 'e2e_tput_user');
chart('c_prefill_tput_user', 'Prefill Throughput Per User', 'tokens/sec/user', 'prefill_tput_user');
chart('c_ttft_avg', 'TTFT (avg)', 'ms', 'ttft_avg');
chart('c_ttft_p99', 'TTFT (P99)', 'ms', 'ttft_p99');
chart('c_itl_avg', 'Inter Token Latency (avg)', 'ms', 'itl_avg');
chart('c_itl_p99', 'Inter Token Latency (P99)', 'ms', 'itl_p99');
chart('c_lat_avg', 'Request Latency (avg)', 'ms', 'lat_avg');
chart('c_lat_p99', 'Request Latency (P99)', 'ms', 'lat_p99');
chart('c_image_tput', 'Image Throughput', 'images/sec', 'image_tput');
chart('c_req_tput', 'Request Throughput', 'requests/sec', 'req_tput');
chart('c_osl_avg', 'Output Sequence Length (avg)', 'tokens', 'osl_avg');
chart('c_osl_min', 'Output Sequence Length (min)', 'tokens', 'osl_min');
chart('c_osl_max', 'Output Sequence Length (max)', 'tokens', 'osl_max');
chart('c_isl_avg', 'Input Sequence Length (avg)', 'tokens', 'isl_avg');
chart('c_gpu_power_active', 'GPU Power (active GPUs only)', 'Watts', 'gpu_power_active');
chart('c_gpu_mem_gb', 'GPU Memory Used per GPU', 'GB', 'gpu_mem_gb');
chart('c_gpu_util', 'GPU Utilization (mean)', '%', 'gpu_util');
chart('c_tok_per_joule', 'Energy Efficiency', 'tokens/Joule', 'tok_per_joule');
chart('c_duration', 'Benchmark Duration', 'sec', 'duration');

function clean(a) { return (a || []).filter(v => v !== null && v !== undefined); }
function peak(a) {
    const v = clean(a);
    if (!v.length) return [null, null];
    const m = Math.max(...v);
    return [m, D.concurrency[a.indexOf(m)]];
}
function sweetSpot(out, ttft, itl, conc) {
    const i = 3, j = 4;
    return out[i].toFixed(0) + '-' + out[j].toFixed(0) + ' tok/s at conc ' + conc[i] + '-' + conc[j] +
        ' (TTFT ' + ttft[i].toFixed(0) + '-' + ttft[j].toFixed(0) + 'ms, ITL ' + itl[i].toFixed(1) + '-' + itl[j].toFixed(1) + 'ms)';
}

const [p2, k2] = peak(D.tp2.out_tput);
const [p4, k4] = peak(D.tp4.out_tput);
const g2 = D.tp2.active_gpus[0] || 2;
const g4 = D.tp4.active_gpus[0] || 4;

const execItems = [
    '<strong>TP2 Peak Output Throughput:</strong> ' + (p2 ? p2.toFixed(1) : 'N/A') + ' tok/s at concurrency ' + (k2 || 'N/A'),
    '<strong>TP4 Peak Output Throughput:</strong> ' + (p4 ? p4.toFixed(1) : 'N/A') + ' tok/s at concurrency ' + (k4 || 'N/A'),
    '<strong>TP2 Sweet Spot:</strong> ' + sweetSpot(D.tp2.out_tput, D.tp2.ttft_avg, D.tp2.itl_avg, D.concurrency),
    '<strong>TP4 Sweet Spot:</strong> ' + sweetSpot(D.tp4.out_tput, D.tp4.ttft_avg, D.tp4.itl_avg, D.concurrency),
    '<strong>Throughput-per-GPU:</strong> TP2 achieves ' + (p2 ? (p2 / g2).toFixed(1) : 'N/A') + ' tok/s/GPU vs TP4\'s ' + (p4 ? (p4 / g4).toFixed(1) : 'N/A') + ' tok/s/GPU'
];

document.getElementById('execGrid').innerHTML = execItems.map(s => '<div class="exec-item">' + s + '</div>').join('');

const rows = [
    ['Output tput (tok/s)', 'out_tput', 1],
    ['Per-GPU tput (tok/s)', 'tput_per_gpu', 1],
    ['Per-user tput (tok/s)', 'out_tput_user', 1],
    ['TTFT avg (ms)', 'ttft_avg', 0],
    ['TTFT P99 (ms)', 'ttft_p99', 0],
    ['ITL avg (ms)', 'itl_avg', 2],
    ['Request latency avg (ms)', 'lat_avg', 0],
    ['OSL avg (tokens)', 'osl_avg', 1],
    ['GPU power active (W)', 'gpu_power_active', 0],
    ['Tokens per Joule', 'tok_per_joule', 3]
];

let html = '<thead><tr><th>Metric</th><th>TP</th>' +
    D.concurrency.map(c => '<th>c' + c + '</th>').join('') + '</tr></thead><tbody>';
rows.forEach(([label, key, dp]) => {
    ['tp2', 'tp4'].forEach(tp => {
        html += '<tr><td>' + (tp === 'tp2' ? label : '') + '</td>' +
                '<td style="color:' + C[tp] + ';font-weight:600">' + tp.toUpperCase() + '</td>' +
                D.concurrency.map((c, i) => {
                    const v = D[tp][key][i];
                    return '<td>' + (v === null || v === undefined ? '-' : v.toFixed(dp)) + '</td>';
                }).join('') + '</tr>';
    });
});
html += '</tbody>';
document.getElementById('table').innerHTML = html;
</script>
</body>
</html>
